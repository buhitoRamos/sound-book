name: Supabase Keep Alive

on:
  schedule:
    # Se ejecuta a las 00:00 UTC cada 4 días (evita la pausa de los 7 días)
    - cron: '0 0 */4 * *'
  workflow_dispatch: # Esto te permite probarlo manualmente ahora mismo

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Petición de mantenimiento a la tabla users
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/users?select=*" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
          -I
